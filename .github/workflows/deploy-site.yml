name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'stl/**'
      - 'images/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
  # Fired by JanLahmann/Fun-with-Quantum when family/family.json changes → family footer re-renders.
  repository_dispatch:
    types: [family-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          path: ./site
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Tell Bing, Yandex & co. which pages changed (the family's reusable IndexNow job; it sends the
  # sitemap pages whose <lastmod> is today or yesterday). The key is public by design and is served
  # from site/public/105279401a1460fadec1cb5bb559807d.txt.
  indexnow:
    needs: deploy
    if: github.ref == 'refs/heads/main'
    uses: JanLahmann/Fun-with-Quantum/.github/workflows/indexnow.yml@master
    with:
      site: https://qutie.org
      key: 105279401a1460fadec1cb5bb559807d
